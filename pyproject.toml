[project]
name = "archivum"
version = "0.1.0"
description = "Tracker local de fanfics de AO3, estilo Goodreads."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "httpx2",
]
# Solo hace falta en PythonAnywhere (gratis solo sabe correr WSGI, la app es
# ASGI). Local/otros hosts no lo necesitan, por eso separado.
pythonanywhere = [
    "a2wsgi>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]
