name: Sync con AO3

# A demanda (disparado desde la app o manualmente acá) + un cron diario que
# corre `--modo wips` solo, para detectar fics actualizados sin que haga
# falta apretar nada (ver Novedad/_detectar_novedades) y avisar por mail
# (ver _enviar_email_novedades en scripts/gh_action_sync.py). Este workflow
# corre en un runner con salida a internet, a diferencia del host donde vive
# la app.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué sincronizar"
        required: true
        type: choice
        options:
          - bookmarks
          - bookmarks-rapido
          - fic
          - epub
          - marcados
          - wips
      url:
        description: "URL del fic (solo modo=fic)"
        required: false
        type: string
      ao3_id:
        description: "ID de AO3 del fic (solo modo=epub)"
        required: false
        type: string
  schedule:
    # 13:00 UTC todos los días. La corrida programada siempre es --modo wips
    # (ver el paso "Correr sync" más abajo) — es la única que detecta
    # capítulos nuevos/completados, y la más liviana de las que recorren AO3.
    - cron: "0 13 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -e .

      - name: Correr sync
        env:
          AO3_USERNAME: ${{ secrets.AO3_USERNAME }}
          AO3_PASSWORD: ${{ secrets.AO3_PASSWORD }}
          AO3_CONTACT_EMAIL: ${{ secrets.AO3_CONTACT_EMAIL }}
          ARCHIVUM_BASE_URL: ${{ secrets.ARCHIVUM_BASE_URL }}
          ARCHIVUM_SYNC_SECRET: ${{ secrets.ARCHIVUM_SYNC_SECRET }}
          # Para el mail de novedades (ver _enviar_email_novedades) — si no
          # están seteadas, el script simplemente no manda mail.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          # El disparo programado (schedule) no tiene "inputs" — siempre es wips.
          MODO="${{ inputs.modo || 'wips' }}"
          ARGS="--modo $MODO"
          if [ -n "${{ inputs.url }}" ]; then ARGS="$ARGS --url ${{ inputs.url }}"; fi
          if [ -n "${{ inputs.ao3_id }}" ]; then ARGS="$ARGS --ao3-id ${{ inputs.ao3_id }}"; fi
          python scripts/gh_action_sync.py $ARGS
