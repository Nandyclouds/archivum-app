name: Sync con AO3

# A demanda (disparado desde la app) + un cron diario que corre
# suscripciones y wips para CADA cuenta con AO3 conectado, para detectar
# fics nuevos/actualizados sin que haga falta apretar nada (ver Novedad/
# _detectar_novedades) y avisar por mail (ver /sync/notificar-novedades).
# Este workflow corre en un runner con salida a internet normal — a
# diferencia del servidor de Archivum, que no le llega de forma confiable a
# AO3 (ver docstring de app/api/routers/sync.py).
on:
  workflow_dispatch:
    inputs:
      cuenta_id:
        description: "Id de la cuenta que dispara el sync"
        required: true
        type: string
      modo:
        description: "Qué sincronizar"
        required: true
        type: choice
        options:
          - bookmarks
          - bookmarks-rapido
          - fic
          - epub
          - marcados
          - suscripciones
          - wips
      url:
        description: "URL del fic (solo modo=fic)"
        required: false
        type: string
      ao3_id:
        description: "ID de AO3 del fic (solo modo=epub)"
        required: false
        type: string
  schedule:
    # 13:00 UTC todos los días.
    - cron: "0 13 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -e .

      - name: Correr sync
        env:
          AO3_CONTACT_EMAIL: ${{ secrets.AO3_CONTACT_EMAIL }}
          ARCHIVUM_BASE_URL: ${{ secrets.ARCHIVUM_BASE_URL }}
          ARCHIVUM_SYNC_SECRET: ${{ secrets.ARCHIVUM_SYNC_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CUENTAS=$(curl -s -H "X-Sync-Secret: $ARCHIVUM_SYNC_SECRET" "$ARCHIVUM_BASE_URL/api/sync/cuentas-activas" | python -c "import sys,json; print('\n'.join(str(i) for i in json.load(sys.stdin)['cuenta_ids']))")
            for CUENTA_ID in $CUENTAS; do
              echo "=== Cuenta $CUENTA_ID: suscripciones ==="
              python scripts/gh_action_sync.py --cuenta-id "$CUENTA_ID" --modo suscripciones
              echo "=== Cuenta $CUENTA_ID: wips ==="
              python scripts/gh_action_sync.py --cuenta-id "$CUENTA_ID" --modo wips
            done
          else
            ARGS="--cuenta-id ${{ inputs.cuenta_id }} --modo ${{ inputs.modo }}"
            if [ -n "${{ inputs.url }}" ]; then ARGS="$ARGS --url ${{ inputs.url }}"; fi
            if [ -n "${{ inputs.ao3_id }}" ]; then ARGS="$ARGS --ao3-id ${{ inputs.ao3_id }}"; fi
            python scripts/gh_action_sync.py $ARGS
          fi
